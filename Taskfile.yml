version: "3"

tasks:
  setup:
    cmds:
      - go mod tidy
      - hk install --mise

  run:
    cmds:
      - go run . {{.CLI_ARGS}}

  lint:
    cmds:
      - go fmt ./...
      - go vet ./...
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.63.4 run ./...
      - go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...

  test:
    cmds:
      - go test ./...

  test:integration:
    cmds:
      - go test -tags=integration ./...
  test:smoke:
    cmds:
      - go test -tags=smoke -v -timeout 30s ./...

  build:
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build -o dist/mdc-linux-amd64 ./

  ci:
    cmds:
      - task lint
      - task test

  release:snapshot:
    cmds:
      - goreleaser release --snapshot --clean
