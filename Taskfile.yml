version: "3"

tasks:
  setup:
    cmds:
      - go mod tidy
      - hk install --mise

  run:
    cmds:
      - go run . {{.CLI_ARGS}}

  lint:
    cmds:
      - mise run lint

  test:
    cmds:
      - go test ./...

  build:
    cmds:
      - mkdir -p dist
      - GOOS=linux GOARCH=amd64 go build -o dist/mdc-linux-amd64 ./

  ci:
    cmds:
      - task lint
      - task test

  release:snapshot:
    cmds:
      - goreleaser release --snapshot --clean
